[general]
static=yes
writeprotect=yes
clearglobalvars=yes

[globals]

; Predial: PAI without commas (commas break Set()).
; RPID comes from send_rpid=yes + CALLERID(name/num).
[cid-pai]
exten => s,1,NoOp(CID-PAI num=${CALLERID(num)} name=${CALLERID(name)})
 same => n,GotoIf($["${CALLERID(num)}" = ""]?done)
 same => n,Set(PJSIP_HEADER(add,P-Asserted-Identity)=<sip:${CALLERID(num)}@ip.b24-7297-1638417655.bitrixphone.com>)
 same => n(done),Return()

[from-beeline-3888]
exten => s,1,NoOp(IN Beeline 3888 CID=${CALLERID(num)} EXTEN=${EXTEN})
 same => n,System(/usr/bin/curl -s -m 2 -G "https://crm.artflowers.kz/local/crm/cid_bridge.php" --data-urlencode "token=wa_cid_bridge_20260826" --data-urlencode "did=3888" --data-urlencode "cid=${CALLERID(num)}" --data-urlencode "uid=${UNIQUEID}" >/dev/null)
 same => n,Set(CALLERID(name)=${CALLERID(num)})
 same => n,Dial(PJSIP/sip35,90,b(cid-pai^s^1))
 same => n,Hangup()
exten => 3888,1,Goto(s,1)
exten => _X.,1,Goto(s,1)
exten => _+X.,1,Goto(s,1)

[from-beeline-8099]
exten => s,1,NoOp(IN Beeline 8099 CID=${CALLERID(num)} EXTEN=${EXTEN})
 same => n,System(/usr/bin/curl -s -m 2 -G "https://crm.artflowers.kz/local/crm/cid_bridge.php" --data-urlencode "token=wa_cid_bridge_20260826" --data-urlencode "did=8099" --data-urlencode "cid=${CALLERID(num)}" --data-urlencode "uid=${UNIQUEID}" >/dev/null)
 same => n,Dial(PJSIP/sip36,90)
 same => n,Hangup()
exten => 8099,1,Goto(s,1)
exten => _X.,1,Goto(s,1)
exten => _+X.,1,Goto(s,1)

[from-bitrix-3888]
exten => _X.,1,NoOp(OUT Bitrix 3888 to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@beeline-3888,90)
 same => n,Hangup()
exten => _+X.,1,NoOp(OUT Bitrix 3888 to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@beeline-3888,90)
 same => n,Hangup()

[from-bitrix-8099]
exten => _X.,1,NoOp(OUT Bitrix 8099 to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@beeline-8099,90)
 same => n,Hangup()
exten => _+X.,1,NoOp(OUT Bitrix 8099 to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@beeline-8099,90)
 same => n,Hangup()

[default]
exten => _X.,1,NoOp(unmatched ${EXTEN} from ${CHANNEL})
 same => n,Hangup()
